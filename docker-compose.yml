services:
  db:
    image: postgres:16-alpine
    container_name: dhansignal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhansignal
      POSTGRES_USER: dhansignal
      POSTGRES_PASSWORD: dhansignal_dev
    ports:
      - "5432:5432"
    volumes:
      - dhansignal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhansignal -d dhansignal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dhansignal-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dhansignal:dhansignal_dev@db:5432/dhansignal
    ports:
      - "8000:8000"
    volumes:
      - dhansignal_research:/data/research
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dhansignal-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dhansignal_pgdata:
  dhansignal_research:
