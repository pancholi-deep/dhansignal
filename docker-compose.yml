services:
  db:
    image: postgres:16-alpine
    container_name: tradelens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradelens
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens_dev
    ports:
      - "5432:5432"
    volumes:
      - tradelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens -d tradelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tradelens-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradelens:tradelens_dev@db:5432/tradelens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tradelens-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  tradelens_pgdata:
